[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traz"
version = "0.1.0"
description = "Evidence-driven improvement of software and agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nikita Rozanov"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
traz = "traz.cli:main"

[project.urls]
Repository = "https://github.com/megamen32/traz"

[tool.setuptools.packages.find]
include = ["traz*"]

[tool.setuptools.package-data]
traz = ["data/*.json", "web/*"]
